<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SB3 Quest Completer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="ambient ambient-a"></div><div class="ambient ambient-b"></div>
  <div class="grid-layer" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">SB3</div><div><strong>SB3 Quest Completer</strong><span id="brand-subtitle">Sba3 Dev · 2026</span></div></div>
      <div class="search-wrap"><span class="search-icon">⌕</span><input id="search" type="search" placeholder="Search games or Discord task ID" autocomplete="off"><kbd>Ctrl</kbd><kbd>K</kbd></div>
      <button class="avatar" id="account-button" type="button" aria-label="Account">SB</button>
    </header>
    <div class="workspace">
      <main class="library-column">
        <section class="hero-card"><div><p class="eyebrow">DISCORD QUEST LIBRARY</p><h1 id="hero-title">Choose your next quest</h1><p id="hero-copy">Browse verified games and add them to your queue.</p></div><div class="hero-orb">✦</div></section>
        <div class="section-heading"><div><h2>Featured games</h2><span id="library-count">Preparing your library</span></div><span id="connection-state" class="state-dot"><i></i> Ready</span></div>
        <section id="game-grid" class="game-grid" aria-live="polite"></section>
        <button id="load-more" class="ghost-button" type="button" hidden>Load more</button>
      </main>
      <aside class="queue-column">
        <div class="queue-heading"><div><h2>Quest queue</h2><span id="queue-count">0 selected</span></div><button id="stop-all" class="danger-button" type="button" hidden>Stop all</button></div>
        <div id="queue-list" class="queue-list" aria-live="polite"></div>
        <footer class="status-card"><div class="status-line"><i class="pulse"></i><span id="status-text">Ready</span></div><span id="version-text">v0.6.3</span></footer>
      </aside>
    </div>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
