name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild, for example v0.7.7
        required: true
        default: v0.7.7
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply release version
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag must use semantic version format such as v0.0.5 or v0.1.0"
          }
          $mina = Get-Content mina.py -Raw
          $mina = $mina -replace 'VERSION = "[^"]+"', ('VERSION = "' + $version + '"')
          Set-Content mina.py $mina -Encoding UTF8
          $iss = Get-Content installer.iss -Raw
          $iss = $iss -replace '#define MyAppVersion "[^"]+"', ('#define MyAppVersion "' + $version + '"')
          Set-Content installer.iss $iss -Encoding UTF8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pyinstaller requests pillow pypresence pywebview

      - name: Build application EXE
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name SB3QuestCompleter --icon "%CD%\logo.ico"
          --add-data "%CD%\logo.ico;."
          --add-data "%CD%\webui;webui"
          --distpath dist --workpath build --specpath build mina.py

      - name: Build silent updater
        shell: cmd
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name SB3Updater --distpath dist --workpath build-updater --specpath build-updater updater.py

      - name: Create update ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force update-package | Out-Null
          Copy-Item dist\SB3QuestCompleter.exe update-package\SB3QuestCompleter.exe -Force
          Copy-Item dist\SB3Updater.exe update-package\SB3Updater.exe -Force
          Copy-Item logo.ico update-package\logo.ico -Force
          Compress-Archive -Path update-package\* -DestinationPath SB3QuestCompleter-Update.zip -Force

      - name: Build Setup.exe
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss

      - name: Upload installer to GitHub Release
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        shell: pwsh
        run: |
          gh release upload "$env:RELEASE_TAG" `
            "installer-output/SB3QuestCompleter-Setup.exe" `
            "SB3QuestCompleter-Update.zip" --clobber

      - name: Publish update manifest
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          $version = $env:RELEASE_TAG.TrimStart('v')
          $hash = (Get-FileHash "installer-output/SB3QuestCompleter-Setup.exe" -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item "installer-output/SB3QuestCompleter-Setup.exe").Length
          $packageHash = (Get-FileHash "SB3QuestCompleter-Update.zip" -Algorithm SHA256).Hash.ToLower()
          $packageSize = (Get-Item "SB3QuestCompleter-Update.zip").Length
          $manifest = @{
            version = $version
            installer_url = "https://github.com/$($env:REPOSITORY)/releases/download/$($env:RELEASE_TAG)/SB3QuestCompleter-Setup.exe"
            sha256 = $hash
            size = $size
            package_url = "https://github.com/$($env:REPOSITORY)/releases/download/$($env:RELEASE_TAG)/SB3QuestCompleter-Update.zip"
            package_sha256 = $packageHash
            package_size = $packageSize
          } | ConvertTo-Json
          Set-Content update.json $manifest -Encoding UTF8
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: publish update manifest $version"
          git push origin HEAD:main
